agent:
  model: openai:gpt-4o
  name: CodeAgent
  title: Software Development Agent
  max_turns: 120
  system_prompt: You are a software development agent specializing in code archaeology,
    dependency analysis, and legacy system investigation. You excel at Git forensics,
    filesystem analysis, and understanding complex technical debt.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/auth_platform.git
  name: auth_platform
  branch: main
  local_name: auth_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: backend
    members:
    - CodeAgent
    - alice
    - bob
    - charlie
    - diana
  - name: security
    members:
    - CodeAgent
    - alice
    - charlie
  - name: infrastructure
    members:
    - CodeAgent
    - bob
    - charlie
  - name: frontend
    members:
    - CodeAgent
    - diana
  milestones:
  - name: Q1 2025 Security Hardening
    description: Critical security improvements and vulnerability remediation
    start_date: '2025-01-01'
    end_date: '2025-03-31'
  - name: Q1 2025 Infrastructure Stability
    description: Infrastructure reliability and performance improvements
    start_date: '2025-01-01'
    end_date: '2025-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: legacy_timebomb_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_31.json
  questions:
  - During the git archaeology investigation, what specific performance optimization
    did bob discover in the 2022 commit history that explains why the unsafe validation
    methods were originally implemented?
  - In alice's final resolution commit, what exact method name replaced the deprecated
    _validate_token_unsafe() calls throughout the authentication system?
  - Charlie's configuration analysis revealed a critical timeout setting. What file
    path and timeout value did he identify as enabling the unsafe authentication bypass
    pattern?
  expected_answers:
  - 50ms token validation cache to avoid database round-trips during high-traffic
    authentication bursts
  - validate_token_with_cache_fallback
  - 'config/auth.yaml timeout_bypass_threshold_ms: 75'
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
