agent:
  model: openai:gpt-5
  name: CodeAgent
  title: ML Infrastructure Development Agent
  max_turns: 100
  system_prompt: You are an ML infrastructure development agent analyzing complex
    CLI configuration issues and team coordination in a fast-paced engineering environment.
    You have access to all tools including git, file system, terminal, slack, and
    linear to gather information and solve problems. Your company has a policy to
    only clone from the local version of the repo hosted at http://git.local:3000/pgym/NeMo-Run
    so beware of this.
  tools:
  - notification_server
  - linear_server
  - slack_server
  - filesystem
  - git
repository:
  url: https://github.com/NVIDIA/NeMo-Run.git
  name: NeMo-Run
  branch: main
  commit: 78f54ee182c8057bbe35872e49459c17458b669e
  local_name: NeMo-Run
linear:
  users:
  - CodeAgent
  teams:
  - name: ml
    members:
    - CodeAgent
    - sarah_chen
    - david_wong
  - name: engineering
    members:
    - CodeAgent
    - alex_kim
    - lisa_park
    - sarah_chen
    - david_wong
    - mike_rodriguez
  milestones:
  - name: Q2 2025 Engineering
    description: Engineering infrastructure and CLI tooling improvements
    start_date: '2025-04-01'
    end_date: '2025-06-30'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3000
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: ERROR
  save_agent_logs: true
  log_filename_template: nemo_run_cli_crisis_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_nemo_run_cli_crisis.json
  questions:
  - 'Mike mentioned something about a default value he set in model configuration.
    Sarah referenced ''the specific case from the ticket'' but never stated what it
    was. David mentioned finding ''the issue'' but was vague about location details.
    By correlating across all these conversations and investigating the codebase,
    determine: what is the sum of all numeric values that appear as default parameters
    in factory function definitions within the test files?'
  - 'The team discussed a conversion method and David said ''the line number is in
    the ticket I''m updating'', but the ticket descriptions are vague. Sarah mentioned
    ''that conversion method David mentioned last month'' without naming it. By piecing
    together the timeline and cross-referencing the repository, determine: how many
    total function definitions exist in the file that contains this conversion method?'
  - 'Throughout the conversations, team members made indirect references to test methods
    and files without being explicit. David mentioned following ''our convention''
    for test naming. By analyzing the conversation patterns and repository structure,
    determine: what is the total count of files that contain factory-related test
    methods?'
  - 'The team communicated about a bug resolution timeline with vague date references
    like ''today'', ''last month'', and ''this afternoon''. By parsing all temporal
    references in context and correlating with the event timeline, determine: on what
    date did Sarah first report the factory function conversion issue?'
  - 'Multiple conversations referenced configuration values, default parameters, and
    batch sizes across different contexts. By correlating Mike''s early comment about
    batch size with the actual repository structure at the specified commit, determine:
    what is the exact line number where the first occurrence of the number 32 appears
    in any Python file within the nemo_run directory?'
  expected_answers:
  - '547'
  - '54'
  - '7'
  - '20250515'
  - '142'
evaluation:
  evaluators:
  - exact_match
  - llm_judge
