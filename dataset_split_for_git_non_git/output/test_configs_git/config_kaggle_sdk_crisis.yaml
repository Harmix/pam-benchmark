agent:
  model: openai:gpt-5
  name: CodeAgent
  title: ML Infrastructure Development Agent
  max_turns: 100
  system_prompt: You are an ML infrastructure development agent analyzing complex
    technical dependency issues and team coordination in a fast-paced engineering
    environment. You have access to all tools including git, file system, terminal,
    slack, and linear to gather information and solve problems. Your company has a
    policy to only clone from the local version of the repo hosted at http://git.local:3000/pgym/mle_bench
    so beware of this.
  tools:
  - notification_server
  - linear_server
  - slack_server
  - filesystem
  - git
repository:
  url: https://github.com/openai/mle-bench.git
  name: mle-bench
  branch: main
  commit: d0f60ad0d3b2287469ac3c8ac9767330c928c980
  local_name: mle_bench
linear:
  users:
  - CodeAgent
  teams:
  - name: ml
    members:
    - CodeAgent
    - sarah_chen
    - david_wong
  - name: engineering
    members:
    - CodeAgent
    - alex_kim
    - lisa_park
  milestones:
  - name: Q2 2025 ML Ops
    description: ML Operations infrastructure and tooling improvements
    start_date: '2025-04-01'
    end_date: '2025-06-30'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3000
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: ERROR
  save_agent_logs: true
  log_filename_template: kaggle_sdk_crisis_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_kaggle_sdk_crisis.json
  questions:
  - 'Based on sarah_chen''s vague mention of ''lines 180-200'' and ''exception handling
    code'', clone the repository and examine the source: how many total Python files
    in the entire mlebench/ directory (including subdirectories) contain any import
    statement that references the kaggle package?'
  - 'Following conversations about ''competition-specific modules'' and ''experiments
    directory'', investigate the actual repository structure: what is the exact filename
    (without path) of the Python file in the mlebench/competitions/ subdirectory that
    contains the longest individual function by line count?'
  - 'After correlating references to ''data preparation pipeline'' and ''dataset download
    functionality'', analyze the repository code: what is the total number of function
    definitions (def statements) in the mlebench/data.py file?'
  - 'Through investigation of discussions about ''multiple kaggle imports'' and examining
    the actual codebase structure: in how many distinct Python files throughout the
    entire repository does the exact string ''import kaggle'' appear (including ''import
    kaggle.'' variants)?'
  - 'Following clues about ''core mlebench modules'' and checking the repository''s
    package structure: what is the combined total number of .py files in both the
    mlebench/ directory and the tests/ directory?'
  expected_answers:
  - '9'
  - prepare.py
  - '14'
  - '3'
  - '194'
evaluation:
  evaluators:
  - exact_match
  - llm_judge
