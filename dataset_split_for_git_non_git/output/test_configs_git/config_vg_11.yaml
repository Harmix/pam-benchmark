agent:
  model: openai:gpt-4o
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing complex data quality
    issues involving legacy system integrations, cross-team dependencies, and customer
    impact escalation.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/customer_billing_platform.git
  name: customer_billing_platform
  branch: main
  local_name: customer_billing_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
  - name: customer-support
    members:
    - CodeAgent
    - alice
  - name: billing
    members:
    - CodeAgent
    - bob
    - diana
  - name: legal
    members:
    - CodeAgent
    - charlie
  milestones:
  - name: Q4 2024 Billing Modernization
    description: Modernize customer billing and CRM integration systems
    start_date: '2024-10-01'
    end_date: '2024-12-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: customer_name_crisis_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_11.json
  questions:
  - What routine system change triggered the customer name corruption and why did
    it specifically affect international customers with special characters in their
    names?
  - During the emergency war room meeting, which team attempted a fix that made the
    billing problem worse and what specific solution did they implement?
  - What specific technical evidence did CodeAgent discover that connected the CRM
    sync optimization back to the customer name corruption issue?
  expected_answers:
  - CodeAgent changed CRM sync encoding from UTF-8 to Latin-1 for performance optimization
    which corrupted international customer names with special characters like accents
    and umlauts
  - bob's billing team implemented name normalization that stripped all non-ASCII
    characters making corrupted names completely unreadable instead of just garbled
  - CodeAgent found the encoding parameter change in git commit logs and verified
    that rollback to UTF-8 immediately fixed name corruption in test environment
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
