# Competitive Catalyst - Market Adaptation and Strategic Pivot

# Agent Configuration
agent:
  model: "openai:gpt-4o"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing competitive market dynamics, strategic product decisions, and team expansion in response to external market pressures."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/devstudio_code_editor.git"
  name: "devstudio_code_editor"
  branch: "main"
  local_name: "devstudio_code_editor"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "product"
      members: ["CodeAgent", "alice", "diana"]
    - name: "engineering"
      members: ["CodeAgent", "bob", "diana"]
    - name: "security"
      members: ["CodeAgent", "charlie"]
    - name: "ai-research"
      members: ["CodeAgent"]
  milestones:
    - name: "Q1 2025 AI Integration Initiative"
      description: "Strategic response to competitive AI coding assistant market"
      start_date: "2025-01-15"
      end_date: "2025-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3004
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "competitive_catalyst_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_8.json"
  questions:
    - "What specific competitor product and feature capabilities triggered our strategic AI integration initiative in mid-January? Include the competitor name and the key technical breakthrough that prompted our response."
    - "Based on alice's competitive analysis discussions, what primary market risk did she identify if DevStudio failed to respond to this AI coding assistant trend? Focus on her strategic reasoning about market positioning."
    - "Which customer segment showed the strongest demand for AI coding features according to the support tickets and sales feedback, and what specific use case or workflow did they emphasize most frequently?"
  expected_answers:
    - "CodeFlow AI's autonomous code generation with 95% syntax accuracy and real-time debugging suggestions"
    - "enterprise customers would migrate to AI-first competitors leaving DevStudio as legacy tool in traditional IDE market"
    - "enterprise development teams emphasized AI-assisted code review and automated documentation generation workflows"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
