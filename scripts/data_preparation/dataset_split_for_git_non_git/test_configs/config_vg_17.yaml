# Version Control Wars - Multi-Thread Crisis Coordination Failure

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 120
  system_prompt: "You are a software development agent analyzing complex multi-threaded crisis response coordination across security, release management, and customer communications. Track overlapping version numbers, conflicting priorities, and communication breakdown patterns."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/financial_trading_platform.git"
  name: "financial_trading_platform" 
  branch: "main"
  local_name: "financial_trading_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "security"
      members: ["CodeAgent", "charlie", "diana"]
    - name: "release"
      members: ["CodeAgent", "bob", "alice"]
    - name: "customer-success"
      members: ["CodeAgent", "diana", "alice"]
  milestones:
    - name: "Emergency Security Response"
      description: "Critical vulnerability response and system stabilization"
      start_date: "2024-12-10"
      end_date: "2024-12-12"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "version_wars_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_17.json"
  questions:
    - "Identify the exact version number that charlie's security team released that conflicted with bob's rollback strategy, and specify which CVE number this version was intended to address. Answer exact version number first and then CVE number"
    - "In which specific Slack channel did diana first announce to customers that version 2.4.2 was stable, and what was the precise timestamp of this announcement?"
    - "What was the root cause mechanism that bob identified explaining why charlie's security patch v2.4.2 actually made the customer trading latency worse rather than better?"
  expected_answers:
    - "version 2.4.2 conflicted with bob's rollback strategy and was intended to address CVE-2024-8847"
    - "diana announced version 2.4.2 stability in #customer-success channel at timestamp 2024-12-11T1445"
    - "charlie's v2.4.2 security patch introduced database connection pooling changes that increased trading API latency from 50ms to 200ms"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
