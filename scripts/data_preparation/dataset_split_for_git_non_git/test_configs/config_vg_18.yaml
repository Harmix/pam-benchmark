# Research Tornado - High-velocity AI Research Chaos

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Research Coordination Agent"
  max_turns: 120
  system_prompt: "You are a research coordination agent analyzing high-velocity AI research environments with multiple parallel experiments, cross-channel technical discussions, and rapid iteration cycles."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/attention_mechanisms_research.git"
  name: "attention_mechanisms_research"
  branch: "main"
  local_name: "attention_mechanisms_research"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "research"
      members: ["CodeAgent", "diana", "bob", "charlie"]
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "charlie"]
    - name: "product"
      members: ["CodeAgent", "alice"]
  milestones:
    - name: "Q1 2025 Attention Research Sprint"
      description: "Breakthrough attention mechanism research and implementation"
      start_date: "2025-01-15"
      end_date: "2025-03-15"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "research_tornado_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_18.json"
  questions:
    - "Which specific research insight triggered the team to split into three competing attention mechanism approaches instead of pursuing a unified direction?"
    - "What was the fundamental technical reason why integrating all three attention approaches failed despite each showing individual success in benchmarks?"
    - "When forced to choose one approach for the customer demo deadline, how did the team eventually resolve the convergence crisis and what was their final technical solution?"
  expected_answers:
    - "diana's transformer efficiency paper showing sparse attention could reduce compute by 40% while hierarchical attention improved accuracy by 15% creating impossible optimization tradeoff"
    - "memory allocation conflicts where each approach optimized for different tensor shapes making them incompatible at GPU kernel level"
    - "alice proposed problem decomposition using sparse for preprocessing, hierarchical for main inference, and multi-head for output layer"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
