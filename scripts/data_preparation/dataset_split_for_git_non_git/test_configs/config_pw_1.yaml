# Conflict Resolution & Updates - Authentication System Scenario

# Agent Configuration
agent:
  model: "openai:gpt-4o"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing project timelines and decisions."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/auth_system_demo.git"
  name: "auth_system_demo"
  branch: "main"
  local_name: "auth_system_demo"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob"]
    - name: "security"
      members: ["CodeAgent", "charlie", "diana"]
  milestones:
    - name: "Q1 2024 Auth Modernization"
      description: "Modernize authentication system for better user experience"
      start_date: "2024-01-01"
      end_date: "2024-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3000
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "conflict_resolution_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_pw_1.json"
  questions:
    - "There is a recent bug reported by a PM. Look through all the Slack, Linear and Git history and find the cause of this issue and suggest a fix. Your output should be in the following format: [Cause]  <comma separated status of the oldest tickets that cause the issue>, [fix] <suggestions for fix>"
  expected_answers:
    - "[Cause] Git pr # 428 , [Fix] revert the change of limiting the creation of new tabs"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]  # Available: exact_match, llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"  # Model for LLM judge evaluation
