# Langflow Composio Crisis - Complex Multi-Platform Memory Challenge

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Platform Engineering Development Agent"
  max_turns: 100
  system_prompt: "You are a platform engineering development agent analyzing complex dependency issues and cross-team coordination in a software development environment. You have access to all tools including git, file system, terminal, slack, and linear to gather information and solve problems. Your company has a policy to only clone from the local version of the repo hosted at http://git.local:3000/pgym/langflow so beware of this."
  tools:
    - notification_server
    - linear_server
    - slack_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/langflow-ai/langflow.git"
  name: "langflow"
  branch: "main"
  commit: "462b630de4a6f5f1dc0c6104ee1af0b62611f2e1"
  local_name: "langflow"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "sarah_chen", "david_wong", "sandesh_kumar"]
    - name: "ml"
      members: ["CodeAgent", "mike_torres", "jessica_intern"]
  milestones:
    - name: "Q3 2025 Platform Enhancement"
      description: "Platform integration improvements and dependency management"
      start_date: "2025-08-01"
      end_date: "2025-09-30"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3000
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "ERROR"
  save_agent_logs: true
  log_filename_template: "langflow_composio_crisis_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_langflow_composio_crisis.json"
  questions:
    - "What specific file type did sandesh_kumar need to sync from the main branch to resolve his import errors?"
    - "What is the exact phrase david_wong used to describe the core problem causing environment inconsistencies?"
    - "On which specific date (in YYYY-MM-DD format) was the 'Backend Startup Failure - Development Blocked' Linear ticket marked as completed?"
  expected_answers:
    - "uv.lock"
    - "dependency snapshot drift"
    - "2025-08-22"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]