# Invisible Cascade - Hidden Integration Failures Behind Perfect Metrics

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing complex situations involving database optimizations, external integrations, monitoring blind spots, and cascading failures that appear hidden behind successful internal metrics."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/saas_integration_platform.git"
  name: "saas_integration_platform"
  branch: "main"
  local_name: "saas_integration_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "product"
      members: ["CodeAgent", "alice"]
    - name: "infrastructure"
      members: ["CodeAgent", "diana", "charlie"]
    - name: "customer-success"
      members: ["CodeAgent", "alice"]
  milestones:
    - name: "Q4 2025 Performance Reviews"
      description: "Database and system performance optimizations for Q4 performance evaluations"
      start_date: "2025-03-01"
      end_date: "2025-04-30"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "invisible_cascade_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_4.json"
  questions:
    - "Customer satisfaction dropped 15% after database optimizations that showed perfect internal metrics. What was the hidden technical root cause and why did monitoring systems miss it?. Answer in one sentence, its fine to have something dense and phrase or keyword riddled as long as its true and understandable."
    - "During the post-mortem analysis, what three specific systemic issues did the team identify that allowed this problem to go undetected for weeks? Be concise and answer in one or two continuous sentences then write a report with points kind of thing."
    - "Which team member first discovered the connection between the database optimization and external integration failures, and what specific customer workflow evidence led to this discovery?"
  expected_answers:
    - "Database connection pool optimization used aggressive timeouts that worked for internal APIs but broke external webhook deliveries, monitoring systems missed it because they only tracked internal service health not external integration status"
    - "Monitoring blind spot for external integrations, aggressive internal timeout optimization breaking external webhook requirements, and inadequate integration testing scope during performance changes"
    - "bob discovered the connection by investigating customer workflows and finding webhook delivery failures to third-party services like Stripe and email providers"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
