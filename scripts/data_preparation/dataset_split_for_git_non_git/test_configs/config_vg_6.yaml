# Integration Trap - Cross-System Data Corruption via Race Conditions

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing complex cross-system integrations, data integrity issues, and distributed system race conditions in workplace environments."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/ecommerce_payment_inventory.git"
  name: "ecommerce_payment_inventory"
  branch: "main"
  local_name: "ecommerce_payment_inventory"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "payments"
      members: ["CodeAgent", "alice", "diana"]
    - name: "inventory"
      members: ["CodeAgent", "bob", "diana"]
    - name: "security"
      members: ["CodeAgent", "charlie"]
    - name: "infrastructure"
      members: ["CodeAgent", "bob", "charlie"]
  milestones:
    - name: "Q4 2024 Checkout Integration"
      description: "Real-time inventory integration with payment processing for seamless checkout"
      start_date: "2024-11-01"
      end_date: "2024-11-30"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "integration_trap_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_6.json"
  questions:
    - "The Q1 audit revealed $47K in inventory-payment mismatches. What specific technical integration pattern or mechanism caused these data discrepancies? Focus on the core technical issue, not secondary factors like UI problems or database migrations."
    - "During the post-mortem discussion, what specific prevention method or process improvement did alice propose to catch similar distributed system issues in future integrations? Provide the exact method name or description she suggested."
    - "Which team member first identified the connection between phantom customer charges and inventory discrepancies during the audit investigation? Answer with just the person's name who made this key discovery."
  expected_answers:
    - "race condition in simultaneous inventory reservation and payment processing during 200ms overlap window with optimistic locking failure"
    - "mandatory distributed transaction analysis for cross-system integrations"
    - "charlie"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
