# Observability Awakening - Agentic Workflow Evolution Crisis

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing the evolution of conversational AI systems from simple prompt-response to complex multi-agent workflows requiring sophisticated observability infrastructure."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/agentic_writing_platform.git"
  name: "agentic_writing_platform"
  branch: "main"
  local_name: "agentic_writing_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "product"
      members: ["CodeAgent", "alice"]
    - name: "research"
      members: ["CodeAgent", "charlie", "diana"]
  milestones:
    - name: "Q1 2025 Agentic Evolution"
      description: "Transform from simple writing assistant to complex multi-agent workflow platform"
      start_date: "2025-01-01"
      end_date: "2025-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "observability_awakening_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_28.json"
  questions:
    - "What specific customer complaint pattern about AI decision traceability forced the migration from simple request-response logging to complex observability infrastructure? Be concise and answer in 1 sentence."
    - "Which research paper that charlie shared in February became critical for solving the conversation state persistence problem across multiple turns? Be concise and answer in one sentence"
    - "What was the root technical cause of the audit trail corruption that enterprise client TechFlow discovered during their compliance review? Be concise and answer in one sentence"
  expected_answers:
    - "Enterprise clients couldn't trace which tool call in multi-step reasoning chains caused incorrect citations and fact-check failures"
    - "Anthropic's Constitutional AI paper provided the framework for maintaining conversation context across tool calls and multi-turn interactions"
    - "Conversation state serialization bug caused tool call dependency graphs to reference stale conversation IDs when conversations exceeded 32k token context windows"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
