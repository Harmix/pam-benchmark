# Feature Flag Phantom - Split Reality Causing Team Confusion

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing complex workplace situations involving feature flags, A/B testing, and conflicting user experiences across different cohorts."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/ecommerce_search_system.git"
  name: "ecommerce_search_system"
  branch: "main"
  local_name: "ecommerce_search_system"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "product"
      members: ["CodeAgent", "alice"]
    - name: "data"
      members: ["CodeAgent", "diana", "bob"]
  milestones:
    - name: "Q1 2025 Search Improvements"
      description: "Improve search relevance and user experience through ML-powered algorithms"
      start_date: "2025-01-01"
      end_date: "2025-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "feature_flag_phantom_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_3.json"
  questions:
    - "Team members reported contradictory search behaviors with some saying 'search is broken' while others said 'search works fine'. What was the root cause of these conflicting reports?"
    - "During the post-mortem discussion, what specific operational policy did alice mandate to prevent similar confusion in future feature rollouts?"
    - "Which team member connected the conflicting user reports to the actual technical implementation, and what evidence did they provide?"
  expected_answers:
    - "Feature flag split created two different search experiences - 30% users saw new ML algorithm while 70% saw old algorithm, causing contradictory reports"
    - "alice mandated that all internal team members must be explicitly assigned to specific test groups rather than random distribution"
    - "diana connected the reports to feature flags by analyzing engagement metrics that showed 30/70 split matching the flag distribution"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
