# The External Integration Maze - Customer-Vendor Dynamic

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 150
  system_prompt: "You are a software development agent analyzing complex customer-vendor dynamics involving LLM evaluation solutions, prototype development, and enterprise integration challenges."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/evaluation_platform.git"
  name: "evaluation_platform"
  branch: "main"
  local_name: "evaluation_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "sales"
      members: ["CodeAgent", "alice"]
    - name: "research"
      members: ["CodeAgent", "diana", "charlie"]
  milestones:
    - name: "Q4 2024 Enterprise Push"
      description: "Expand enterprise evaluation tooling capabilities"
      start_date: "2024-10-01"
      end_date: "2024-12-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "integration_maze_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_32.json"
  questions:
    - "What specific technical limitation in MegaCorp's environment caused the integration difficulty that Bob reported after the prototype deployment? Answer precisely and in 1-2 sentences atmost"
    - "Given this integration limitation, what staged approach did diana propose to replace the rapid prototyping strategy? Answer precisely and concisely and in a couple of sentences tops"
    - "Based on the MegaCorp integration failure and diana's new approach, what mandatory assessment process did alice implement before accepting future enterprise evaluation customers?"
  expected_answers:
    - "MegaCorp's locked-down authentication system with undocumented API rate limits and firewall restrictions preventing external evaluation harness access"
    - "Customer environment analysis phase before any prototype development with staged integration testing in isolated sandbox environments"
    - "Technical environment compatibility assessment as mandatory prerequisite including firewall rules, authentication protocols, and API access verification"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
