# Silent Regression - Performance Optimization Causes Business Impact

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing complex cross-platform workplace situations involving performance optimizations, business metrics, and technical decisions."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/ecommerce_analytics_dashboard.git"
  name: "ecommerce_analytics_dashboard"
  branch: "main"
  local_name: "ecommerce_analytics_dashboard"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "product"
      members: ["CodeAgent", "alice"]
    - name: "security"
      members: ["CodeAgent", "charlie", "diana"]
  milestones:
    - name: "Q4 2024 Performance Initiative"
      description: "Critical performance improvements for enterprise client retention"
      start_date: "2024-12-01"
      end_date: "2024-12-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3001
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "silent_regression_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_1.json"
  questions:
    - "Customer renewal rates dropped from above 90 percent to below 80% after Q4 performance improvements. What specific technical change caused this business impact and what was the root cause mechanism?"
    - "During the post-mortem discussion, what prevention method did the team identify that could have caught this issue before it affected customers?"
    - "Which team member first made the connection between the performance optimization and customer churn, and what specific evidence did they provide?"
  expected_answers:
    - "2-hour cache TTL on dashboard metrics broke real-time data visibility for e-commerce flash sales and inventory decisions"
    - "alice suggested mandatory real-time use case review for any caching changes during architecture discussions"
    - "charlie connected performance optimization to churn by analyzing exit interview data showing customers complained about unreliable real-time data"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
