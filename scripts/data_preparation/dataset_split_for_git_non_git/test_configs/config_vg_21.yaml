# Infrastructure Identity Crisis - Competing Technical Philosophies and Cascading Dependencies

# Agent Configuration
agent:
  model: "openai:gpt-4o"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 130
  system_prompt: "You are a software development agent analyzing complex technical decision-making processes involving competing philosophies, cascading infrastructure changes, and interconnected system dependencies."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/distributed_analytics_platform.git"
  name: "distributed_analytics_platform"
  branch: "main"
  local_name: "distributed_analytics_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "infrastructure"
      members: ["CodeAgent", "bob", "charlie"]
    - name: "architecture"
      members: ["CodeAgent", "diana", "alice"]
  milestones:
    - name: "Q1 2024 Infrastructure Modernization"
      description: "Critical database migration and infrastructure overhaul for enterprise scalability"
      start_date: "2024-02-01"
      end_date: "2024-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "infrastructure_crisis_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_21.json"
  questions:
    - "When the production database crisis occurred, which team member first identified the underlying configuration issue in infrastructure discussions, what specific technical parameter did they cite as the root cause, and which previous security enhancement ticket created this constraint?"
    - "During the technical philosophy debates about database migration approaches, what was the decisive factor that alice mentioned for rejecting the distributed consensus solution, and which specific business requirement did she reference to support this decision?"
    - "In the final resolution phase when the hybrid approach was implemented, what was the exact reason bob gave for why the connection multiplexing solution resolved the performance bottleneck, and which architectural principle did he cite from diana's earlier design discussions?"
  expected_answers:
    - "charlie identified max_connections parameter set to 150 as root cause, referencing the february 12th database security hardening ticket that reduced connection limits"
    - "alice rejected distributed consensus due to 99.9% uptime SLA requirement, citing the TechFlow enterprise contract stipulation that cannot tolerate consensus partition scenarios"
    - "bob explained connection multiplexing eliminated thread contention by implementing diana's resource pooling abstraction principle from the february 20th architecture design thread"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
