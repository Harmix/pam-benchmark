agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing project timelines
    and technical decisions.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/monitoring_platform.git
  name: monitoring_platform
  branch: main
  local_name: monitoring_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: platform
    members:
    - CodeAgent
    - alex
    - blake
  - name: frontend
    members:
    - CodeAgent
    - casey
    - drew
  - name: devops
    members:
    - CodeAgent
    - elena
    - finn
  milestones:
  - name: Q2 2024 Observability
    description: Enhanced monitoring and alerting capabilities
    start_date: '2024-04-01'
    end_date: '2024-06-30'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3000
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: ERROR
  save_agent_logs: true
  log_filename_template: cascade_scenario_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_5.json
  questions:
  - 'After the performance monitoring rollback, what happened to the auto-scaling
    feature that depended on it, and what was the final solution? Provide your answer
    in the format: [FINAL ANSWER] <what happened to auto-scaling>, <final solution>'
  - 'What was the root cause of the monitoring system rollback, and which team led
    the rollback decision? Provide your answer in the format: [FINAL ANSWER] <root
    cause>, <team that led rollback>'
  - 'How did the alerts dashboard project end up being handled differently from the
    auto-scaling project after the rollback? Provide your answer in the format: [FINAL
    ANSWER] <alerts dashboard outcome>, <auto-scaling outcome>'
  expected_answers:
  - split into separate lightweight metrics collection, simplified rule-based auto-scaling
    with basic CPU metrics
  - database performance degradation from 50x more queries, platform team
  - cancelled and replaced with simple alerts interface, split into basic and advanced
    versions
evaluation:
  evaluators:
  - exact_match
  - llm_judge
