agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing complex test-time
    search optimization systems, combinatorial explosion failures, and algorithmic
    complexity cascades.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/test_time_search_platform.git
  name: test_time_search_platform
  branch: main
  local_name: test_time_search_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
  - name: research
    members:
    - CodeAgent
    - diana
    - charlie
  - name: algorithms
    members:
    - CodeAgent
    - bob
    - diana
  milestones:
  - name: Q1 2025 Search Optimization Initiative
    description: Implement advanced test-time search optimization for creative generation
      and reasoning tasks
    start_date: '2025-01-01'
    end_date: '2025-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: search_time_spiral_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_27.json
  questions:
  - What specific search optimization change introduced non-convergent behavior in
    the generation system, and what was the underlying algorithmic cause?
  - Which team member identified the recursive search infinite loop problem and what
    mathematical constraint did they discover that prevented convergence?
  - What was the exact branching factor explosion that caused the 45-second latency
    issue, and which search depth parameter triggered this exponential growth?
  expected_answers:
  - Multi-agent adversarial search introduced non-convergent behavior because competing
    search agents created infinite exploration loops without termination criteria
  - diana identified recursive pruning model inference created infinite loops when
    pruning classifiers triggered their own search trees with mathematical impossibility
    of convergence
  - Tree search depth parameter increased from 5 to 50+ steps creating 8^50 branching
    factor explosion causing 45-second latency per generation request
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
