agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent specializing in dependency analysis
    and code archaeology. You excel at tracing through git history, analyzing file
    dependencies, and understanding legacy technical decisions.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/graphql_platform.git
  name: graphql_platform
  branch: main
  local_name: graphql_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: backend
    members:
    - CodeAgent
    - alice
    - bob
    - charlie
    - diana
  - name: frontend
    members:
    - CodeAgent
    - alice
    - diana
  - name: devops
    members:
    - CodeAgent
    - bob
    - charlie
  - name: architecture
    members:
    - CodeAgent
    - alice
    - charlie
  milestones:
  - name: Q1 2025 OpenGraphQL Migration
    description: Critical migration away from deprecated OpenGraphQL library
    start_date: '2025-01-15'
    end_date: '2025-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: dependency_archaeology_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_30.json
  questions:
  - Bob performed git archaeology to find when OpenGraphQL was first tightly coupled
    to the auth system. What specific file path did he identify as containing the
    problematic integration pattern?
  - During the dependency audit, charlie discovered a circular import issue. What
    was the exact reason diana's initial migration approach failed according to the
    build system analysis?
  - Alice's historical investigation revealed the original design constraint. What
    specific performance requirement from 2022 led to the tight coupling that now
    prevents easy migration?
  expected_answers:
  - src/auth/validators/GraphQLUserValidator.js
  - OpenGraphQL schema validation called before GraphQL types were initialized causing
    undefined reference errors
  - sub-100ms API response requirement forced direct schema object sharing instead
    of API calls
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
