agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing dependency management
    issues and collaborative debugging across Git repositories.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/openai/evals.git
  name: evals
  branch: main
  local_name: ml_evals
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
  - name: ml
    members:
    - CodeAgent
    - alice
    - bob
    - diana
  milestones:
  - name: Q1 2025 Security Updates
    description: Address security vulnerabilities in dependencies
    start_date: '2025-01-01'
    end_date: '2025-01-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: dependency_drift_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_12.json
  questions:
  - What specific dependency version change caused the computer vision evaluation
    failures?
  - Who identified the numpy-CUDA compatibility issue and through which testing approach?
  - What was the final solution implemented to resolve the version conflicts?
  expected_answers:
  - numpy 1.24.0 upgrade broke compatibility with older CUDA tensor operations
  - charlie identified it through local CUDA environment testing on feature branch
    cuda-debug
  - pinned numpy==1.23.5 and torch>=1.13.0 with compatibility matrix in requirements-stable.txt
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
