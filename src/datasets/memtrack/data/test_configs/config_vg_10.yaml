agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing complex regulatory
    compliance situations involving security implementations, team dynamics, and system
    migrations.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/customer_data_platform.git
  name: customer_data_platform
  branch: main
  local_name: customer_data_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
    - eve
  - name: security
    members:
    - CodeAgent
    - charlie
    - diana
  - name: legal
    members:
    - CodeAgent
    - alice
  milestones:
  - name: Q1 2025 Compliance Readiness
    description: Implement GDPR audit trail requirements for customer data access
    start_date: '2025-01-01'
    end_date: '2025-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: compliance_paradox_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_10.json
  questions:
  - What regulatory requirement triggered the logging implementation and how did the
    team misunderstand what was needed versus the simple solution that legal originally
    intended?
  - According to the post-mortem discussion, what over-engineering decision created
    compliance violations and what basic approach should have been used instead?
  - How did the database migration project interfere with identifying the real logging
    performance issues and who first made the connection between these two problems?
  expected_answers:
  - GDPR audit trail requirement was misunderstood as needing comprehensive logging
    of all data access when legal only wanted simple user action timestamps without
    PII
  - bob identified that storing full request payloads in logs created PII violations
    when simple action metadata logging was sufficient
  - PostgreSQL migration performance issues masked logging system slowdowns and diana
    connected that migration rollback temporarily fixed performance hiding the logging
    problems
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
