agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 120
  system_prompt: You are a software development agent analyzing complex organizational
    chaos during a problematic acquisition. Track multiple competing narratives, technical
    migration failures, and team fragmentation across platforms.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/ai_startup_platform.git
  name: ai_startup_platform
  branch: main
  local_name: ai_startup_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
  - name: research
    members:
    - CodeAgent
    - charlie
    - diana
  - name: integration
    members:
    - CodeAgent
    - bob
    - diana
  milestones:
  - name: TechCorp Integration Phase 1
    description: Mandatory migration to TechCorp infrastructure within 30 days
    start_date: '2024-11-15'
    end_date: '2024-12-15'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: acquisition_spiral_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_16.json
  questions:
  - What was the specific evidence that revealed TechCorp's true acquisition strategy,
    and who discovered this evidence?
  - Which team member made the first public declaration of resistance to the migration,
    and in what specific channel?
  - What competing product name did bob discover TechCorp was building internally?
  expected_answers:
  - 'bob discovered TechCorp''s internal Slack channel #project-neural-competitor
    discussing building identical AI features, found through leaked integration documentation'
  - 'alice declared resistance in #engineering channel stating she would not migrate
    Python codebase to legacy Java infrastructure'
  - NeuralCore Analytics
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
