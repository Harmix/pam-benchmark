services:
  main:
    build:
      context: ${CONTEXT_DIR}/../../../  # Set to project root (3 levels up from environment/)
      dockerfile: ${CONTEXT_DIR}/Dockerfile
    image: ${MAIN_IMAGE_NAME}
    command: [ "sh", "-c", "sleep infinity" ]
    network_mode: ${NETWORK_MODE:-bridge}
    environment:
      - TEST_DIR=${TEST_DIR}
      - EXPERIMENT_NAME=${EXPERIMENT_NAME}
      - TASK_CONFIGS=${TASK_CONFIGS}
      - DEBUG=${DEBUG}
      - DATASET_NAME=memtrack@1.0
      - TASK_NAME=memtrack
      - PAM_AGENT_NAME=PAM@2.0
      # pam_v2 agent settings
      - AGENT=${AGENT}
      - PAM_API_HOST=${PAM_API_HOST}
      - PAM_API_USER=${PAM_API_USER}
      - PAM_API_PASSWORD=${PAM_API_PASSWORD}
      - EVAL_MODEL=${EVAL_MODEL}
      - MAX_QUESTIONS=${MAX_QUESTIONS}
      - SKIP_EVAL=${SKIP_EVAL}
      - OVERWRITE=${OVERWRITE}
      - QUESTION_RANGE_START=${QUESTION_RANGE_START}
      - QUESTION_RANGE_END=${QUESTION_RANGE_END}
      - DEBUG_USER_ID=${DEBUG_USER_ID}
    env_file:
      - ${CONTEXT_DIR}/../../../secrets.env  # secrets.env at project root
    volumes:
      - ${HOST_VERIFIER_LOGS_PATH}:${ENV_VERIFIER_LOGS_PATH}
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY}
