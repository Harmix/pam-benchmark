agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 120
  system_prompt: You are a software development agent analyzing organizational collapse,
    technical debt accumulation under extreme pressure, and cascading system failures
    during a company's final months.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/healthcare_integration_platform.git
  name: healthcare_integration_platform
  branch: main
  local_name: healthcare_integration_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - bob
    - charlie
    - diana
  - name: product
    members:
    - CodeAgent
    - alice
  - name: compliance
    members:
    - CodeAgent
    - charlie
    - diana
  milestones:
  - name: Last Chance Release v2.0
    description: Final product release to avoid company shutdown
    start_date: '2025-01-15'
    end_date: '2025-02-28'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: death_march_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_15.json
  questions:
  - What were the three specific technical shortcuts bob implemented between January
    20-22 that directly caused the HealthSystem Corp demo failure on January 28?
  - On January 15th, diana flagged a patient data encryption vulnerability that charlie
    supported but alice overruled. What was alice's exact three-word reasoning for
    the override decision?
  - During the February 1st production incident, what was the root cause data corruption
    pattern and exactly how many customer accounts were affected according to bob's
    damage report?
  expected_answers:
  - disabled input validation, hardcoded API credentials, removed transaction rollbacks
  - ship or die
  - duplicate patient records merged incorrectly, 847 customer accounts
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
