version: '3.8'

services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-code
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./claude-config:/root/.claude
      - ./outputs:/benchmark_logs
      - ./test_configs:/benchmark_data/test_configs:ro
      - ./test_event_histories:/benchmark_data/test_event_histories:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  claude-config: