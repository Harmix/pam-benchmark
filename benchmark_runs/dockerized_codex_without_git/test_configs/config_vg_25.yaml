agent:
  model: openai:gpt-4o
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing the transition from
    traditional RLHF to multi-turn agentic evaluation systems, including technical
    failures in conversation state management, API reliability issues, and reward
    signal corruption.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/agentic_post_training.git
  name: agentic_post_training
  branch: main
  local_name: agentic_post_training
linear:
  users:
  - CodeAgent
  teams:
  - name: post_training
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
    - eve
  - name: evaluation
    members:
    - CodeAgent
    - diana
    - charlie
    - eve
  - name: infrastructure
    members:
    - CodeAgent
    - bob
    - charlie
  - name: research
    members:
    - CodeAgent
    - diana
    - eve
  milestones:
  - name: Q4 2024 Agentic Evaluation Migration
    description: Transition from paired preference RLHF to multi-turn agentic evaluation
      systems
    start_date: '2024-11-01'
    end_date: '2024-12-20'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: agentic_evaluation_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_25.json
  questions:
  - What specific technical failure in multi-turn conversation state management caused
    the reward model training to become unstable during the RLHF pipeline migration?
  - Which external API reliability issue led to the discovery of reward signal corruption
    during tool-calling evaluations, and what was the corruption rate?
  - What was the root cause of context window exhaustion that forced the architectural
    redesign of the reasoning chain evaluation system?
  expected_answers:
  - Conversation state persistence failure across training steps caused reward model
    gradients to become inconsistent when dialogue context exceeded 8k tokens
  - Weather API timeout failures during tool-calling evaluations corrupted 23% of
    reward signals by returning partial responses marked as successful completions
  - Reasoning chains exceeding 32k context window caused evaluation truncation mid-reasoning,
    forcing switch to hierarchical reasoning chunk architecture
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
