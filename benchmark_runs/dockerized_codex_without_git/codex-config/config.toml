# codex-config/config.toml

# Set the default model you want to use.
# Replace "gpt-4" with any model you have access to, e.g., "gpt-5".
model = "gpt-5"

# Set the provider ID, which matches the section header below.
model_provider = "openai"

# Set the approval policy to "never" for headless execution.
# This means the script will not be paused for user confirmation.
# Use with caution and ensure your tools are safe.
approval_policy = "never"

# Define the model provider configuration.
[model_providers.openai]
  # FIX 1: Added the required 'name' field.
  name = "openai"

  # FIX 2: Corrected the casing to match the docker-compose.yml environment variable.
  # Tell Codex to get the API key from an environment variable named "CODEX_API_KEY".
  env_key = "CODEX_API_KEY"
