agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/auth_system_demo.git
  name: auth_system_demo
  branch: main
  local_name: auth_system_demo
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
  - name: security
    members:
    - CodeAgent
    - charlie
    - diana
  milestones:
  - name: Q1 2024 Auth Modernization
    description: Modernize authentication system for better user experience
    start_date: '2024-01-01'
    end_date: '2024-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3000
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: conflict_resolution_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_4.json
  questions:
  - 'What was the original authentication feature that got cancelled, why was it cancelled,
    and what alternative solution was implemented instead? Provide your answer in
    the format: [FINAL ANSWER] <original feature>, <cancellation reason>, <alternative
    solution>'
  expected_answers:
  - social login integration, security vulnerability in OAuth implementation, multi-factor
    authentication with email verification
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
