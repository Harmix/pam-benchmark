agent:
  model: openai:gpt-4o
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing complex evaluation
    system evolution, distributed systems failures, and cross-platform technical decision
    cascades.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/agentic_evaluation_platform.git
  name: agentic_evaluation_platform
  branch: main
  local_name: agentic_evaluation_platform
linear:
  users:
  - CodeAgent
  teams:
  - name: engineering
    members:
    - CodeAgent
    - alice
    - bob
    - diana
    - charlie
  - name: research
    members:
    - CodeAgent
    - diana
    - charlie
  - name: infrastructure
    members:
    - CodeAgent
    - bob
    - charlie
  milestones:
  - name: Q1 2025 Evaluation Modernization
    description: Transition from basic prompt evaluation to advanced agentic evaluation
      systems
    start_date: '2025-01-01'
    end_date: '2025-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: evaluation_revolution_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_26.json
  questions:
  - What specific technical change introduced non-deterministic evaluation results,
    and what was the underlying infrastructure cause?
  - During the post-mortem discussion, which team member identified the root cause
    of the Kubernetes cluster failures and what specific resource constraint did they
    pinpoint?
  - What was the exact memory requirement explosion that forced the evaluation sharding
    approach, and which conversation threading feature triggered this requirement?
  expected_answers:
  - Dockerized context isolation introduced non-deterministic results due to resource
    contention between container instances competing for CPU scheduling
  - charlie identified Kubernetes cluster failures caused by 500+ concurrent container
    spawns exceeding the 64GB cluster memory limit
  - 32GB per evaluation batch requirement triggered by isolated conversation context
    feature requiring separate memory space for each multi-turn dialogue thread
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
