agent:
  model: openai:gpt-5
  name: CodeAgent
  title: Software Development Agent
  max_turns: 100
  system_prompt: You are a software development agent analyzing open-source disruption,
    business model pivots, and strategic responses to community-driven competitive
    threats in enterprise software.
  tools:
  - notification_server
  - linear_server
  - filesystem
  - git
repository:
  url: https://github.com/testrldd/datapipeline_studio_enterprise.git
  name: datapipeline_studio_enterprise
  branch: main
  local_name: datapipeline_studio_enterprise
linear:
  users:
  - CodeAgent
  teams:
  - name: product
    members:
    - CodeAgent
    - alice
    - bob
  - name: engineering
    members:
    - CodeAgent
    - bob
    - diana
  - name: business
    members:
    - CodeAgent
    - alice
    - charlie
  - name: legal
    members:
    - CodeAgent
    - charlie
  milestones:
  - name: Q1 2025 Open Core Strategy
    description: Strategic response to Apache StreamFlow open-source competitive threat
    start_date: '2025-01-20'
    end_date: '2025-03-31'
docker:
  dockerfile_path: ../images/swe.dockerfile
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3005
    prevent_teardown: true
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true
logging:
  level: INFO
  save_agent_logs: true
  log_filename_template: open_source_disruption_logs_{timestamp}.json
filesystem:
  git_user_root: /root
benchmark:
  event_history: test_event_histories/event_history_vg_9.json
  questions:
  - What specific open-source project and its key capabilities triggered the emergency
    strategy review for DataPipelineStudio? Include the project name and the particular
    features that directly competed with our paid enterprise offerings.
  - After the team debates and customer feedback analysis, what final business model
    strategy did alice propose for responding to the open-source threat? Focus on
    the specific licensing and monetization approach she recommended.
  - Which stakeholder group ultimately created the most pressure for strategic change
    - existing enterprise customers, developer community adoption, or competitive
    market dynamics? Provide specific evidence from the discussions that influenced
    the final decision.
  expected_answers:
  - Apache StreamFlow with visual pipeline builder, real-time data transformation,
    and enterprise-grade monitoring that replicated 85% of DataPipelineStudio's paid
    features
  - open-core model with MIT licensed basic pipeline features and proprietary enterprise
    add-ons for governance, security, and advanced analytics
  - existing enterprise customers threatening cancellation and demanding open-source
    migration paths created the most pressure for strategic change
evaluation:
  evaluators:
  - exact_match
  - llm_judge
  exact_match:
    case_sensitive: false
  llm_judge:
    model: openai:gpt-4o
