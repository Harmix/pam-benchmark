# docker-compose.yml
version: '3.8'

services:
  # Qdrant on custom port
  mem0_store:
    image: qdrant/qdrant:latest
    container_name: mem0_store
    ports:
      - "6333:6333"
    volumes:
      - mem0_storage:/qdrant/storage
    networks:
      - benchmark-network
  # OpenMemory API
  openmemory-api:
    build:
      context: ./mem0/openmemory/api
    container_name: openmemory-api
    environment:
      - USER=pam_user_id
      - API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://mem0_store:6333
      - QDRANT_HOST=mem0_store
      - QDRANT_PORT=6333
    env_file:
      - ./mem0/openmemory/api/.env
    depends_on:
      - mem0_store
    ports:
      - "8765:8765"
    volumes:
      - ./mem0/openmemory/api:/usr/src/openmemory
    command: >
      sh -c "
        echo 'Waiting for Qdrant...' &&
        sleep 5 &&
        echo 'Starting OpenMemory API...' &&
        uvicorn main:app --host 0.0.0.0 --port 8765 --reload --workers 1
      "
    networks:
      - benchmark-network
  # Claude Code container
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-code
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENMEMORY_URL=http://openmemory-api:8765
      - USER_ID=pam_user_id
    volumes:
      - ./claude-config:/root/.claude
      - claude-npm-cache:/root/.npm
      - ./outputs:/workspace/logs
      - ./test_configs:/benchmark_data/test_configs
      - ./test_event_histories:/benchmark_data/test_event_histories
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash
    depends_on:
      - openmemory-api
    networks:
      - benchmark-network

networks:
  benchmark-network:
    driver: bridge

volumes:
  claude-npm-cache:
  mem0_storage: