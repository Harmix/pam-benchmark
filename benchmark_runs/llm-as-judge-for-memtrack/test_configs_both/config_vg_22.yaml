# Dependency Web Collapse - Third-party service degradation cascading workarounds

# Agent Configuration
agent:
  model: "openai:gpt-5"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing complex cascading system failures involving third-party dependencies, workaround implementations, and emergent system complexity."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/data_pipeline_platform.git"
  name: "data_pipeline_platform"
  branch: "main"
  local_name: "data_pipeline_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie", "eve"]
    - name: "platform"
      members: ["CodeAgent", "bob", "charlie"]
    - name: "research"
      members: ["CodeAgent", "diana", "eve"]
  milestones:
    - name: "Q1 2025 Platform Stability"
      description: "Ensure robust data pipeline performance and reliability"
      start_date: "2025-01-01"
      end_date: "2025-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3002
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "dependency_web_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_22.json"
  questions:
    - "What was the root cause of the AnalyticsFlow integration failures that triggered the entire workaround cascade?"
    - "Which specific workaround implementation created the memory leak that caused customer data inconsistencies?"
    - "During the system archaeology investigation, what was eve's key insight that revealed the original problem could have been solved simply?"
  expected_answers:
    - "AnalyticsFlow was A/B testing new data centers causing 3-5% intermittent failures due to geographic routing changes"
    - "charlie's aggressive garbage collection combined with bob's exponential backoff retry logic created memory fragmentation during high-load periods"
    - "eve identified that a simple 30-second timeout adjustment would have handled the data center routing delays instead of building the entire workaround chain"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
