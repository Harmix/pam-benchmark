# Retrieval Evolution - Sparse to Dense to Hybrid to Matryoshka

# Agent Configuration
agent:
  model: "openai:gpt-4o"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 120
  system_prompt: "You are a software development agent analyzing the evolution of retrieval systems from sparse keyword search through dense embeddings to hybrid approaches and finally matryoshka embedding architectures."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/enterprise_search_platform.git"
  name: "enterprise_search_platform"
  branch: "main"
  local_name: "enterprise_search_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "search"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "infrastructure"
      members: ["CodeAgent", "bob", "diana"]
    - name: "research"
      members: ["CodeAgent", "charlie"]
  milestones:
    - name: "Search Infrastructure Modernization"
      description: "Evolve from legacy sparse retrieval to modern embedding-based search"
      start_date: "2024-10-01"
      end_date: "2025-03-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3003
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "retrieval_evolution_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_29.json"
  questions:
    - "What specific technical limitation of the dense embedding system forced the team to implement hybrid sparse-dense retrieval instead of purely dense search?"
    - "During the post-mortem analysis, what was identified as the root cause of why matryoshka embeddings solved the memory scaling problem that standard dense embeddings couldn't handle?"
    - "What was the exact performance metric threshold that triggered the decision to abandon pure sparse search, and which enterprise client's use case revealed this limitation?"
  expected_answers:
    - "Dense embeddings failed on exact entity matching and technical terminology queries where customers needed precise keyword matches rather than semantic similarity"
    - "Matryoshka embeddings allow dynamic dimensionality reduction at query time, enabling 512-dimensional embeddings for simple queries and 2048-dimensional for complex ones, reducing memory usage by 75% while maintaining accuracy"
    - "Sparse search recall dropped below 40% on technical documentation queries, discovered when DataCorp's engineering team couldn't find specific API method names in their 500GB documentation corpus"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
