version: '3.8'

services:
  # Git server to host local repository mirror
  git-server:
    image: gitea/gitea:latest
    container_name: mle_bench_git_server
    ports:
      - "3006:3000"
    volumes:
      - git-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      mle_network:
        aliases:
          - git.local
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=git.local
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://git.local:3000/
    restart: unless-stopped

  # ML Agent container
  ml-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mle_bench_agent
    depends_on:
      - git-server
    volumes:
      - ./logs:/workspace/logs
      - ./agent_work:/workspace/agent_work
      - ./config.yaml:/workspace/config.yaml:ro
    networks:
      - mle_network
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LINEAR_API_KEY=${LINEAR_API_KEY}
      - SLACK_API_TOKEN=${SLACK_API_TOKEN}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
      - GIT_LOCAL_REPO=http://git.local:3000/pgym/mle_bench
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: /bin/bash

networks:
  mle_network:
    driver: bridge
    name: mle_bench_network

volumes:
  git-data:
    name: mle_bench_git_data