# Spec Wars - Divergent Interpretations Leading to Incompatible Implementations

# Agent Configuration
agent:
  model: "openai:gpt-4o"
  name: "CodeAgent"
  title: "Software Development Agent"
  max_turns: 100
  system_prompt: "You are a software development agent analyzing complex workplace situations involving ambiguous specifications, divergent team interpretations, parallel development efforts, and coordination failures across multiple teams."
  tools:
    - notification_server
    - linear_server
    - filesystem
    - git

# Repository Configuration
repository:
  url: "https://github.com/testrldd/user_activity_platform.git"
  name: "user_activity_platform"
  branch: "main"
  local_name: "user_activity_platform"

# Linear Server Configuration
linear:
  users:
    - "CodeAgent"
  teams:
    - name: "engineering"
      members: ["CodeAgent", "alice", "bob", "diana", "charlie"]
    - name: "backend"
      members: ["CodeAgent", "bob"]
    - name: "frontend"
      members: ["CodeAgent", "diana"]
    - name: "security"
      members: ["CodeAgent", "charlie"]
    - name: "product"
      members: ["CodeAgent", "alice"]
  milestones:
    - name: "Q2 2025 TechCorp Contract Renewal"
      description: "Critical features required for TechCorp contract renewal including user activity tracking system"
      start_date: "2025-04-01"
      end_date: "2025-05-31"

# Docker and Infrastructure Configuration
docker:
  dockerfile_path: "../images/swe.dockerfile"
  network:
    prevent_teardown: true
  git_server:
    expose_port: 3004
    prevent_teardown: true

# Monitoring Configuration
monitoring:
  check_interval: 1.0
  auto_stop_when_idle: true

# Logging Configuration
logging:
  level: "INFO"
  save_agent_logs: true
  log_filename_template: "spec_wars_logs_{timestamp}.json"

# Filesystem Injection Configuration
filesystem:
  git_user_root: "/root"

# Benchmark Configuration
benchmark:
  event_history: "test_event_histories/event_history_vg_5.json"
  questions:
    - "Three teams built different 'user activity tracking' systems that couldn't work together for the client demo. What was the root cause of this divergent implementation? Provide a concise explanation mentioning the key person and specific interpretations."
    - "During the demo day crisis, which specific interpretation differences caused the three systems to be incompatible? List the three different approaches in your answer."
    - "What evidence from team discussions showed that each team genuinely believed they were building the correct solution? Provide specific details about how teams used similar terminology but meant different implementations."
  expected_answers:
    - "alice's ambiguous specification written under deadline pressure was interpreted differently - bob as database audit logging, diana as user analytics, charlie as compliance monitoring"
    - "bob focused on database event logging, diana built behavioral analytics dashboards, charlie implemented privacy-safe session recording - three valid but incompatible approaches"
    - "Team Slack discussions showed each using same terminology (tracking, events, user activity) but meaning different technical implementations while celebrating their respective successes"

# Evaluation Configuration
evaluation:
  evaluators: ["exact_match", "llm_judge"]
  exact_match:
    case_sensitive: false
  llm_judge:
    model: "openai:gpt-4o"
